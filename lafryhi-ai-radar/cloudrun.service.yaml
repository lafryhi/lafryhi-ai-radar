apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lafryhi-ai-radar
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: lafryhi-ai-radar-runtime@lafryhi-ai-radar-xprize.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 120
      containers:
        - image: us-central1-docker.pkg.dev/lafryhi-ai-radar-xprize/lafryhi-ai-radar/lafryhi-ai-radar:sprint7-paid-plans
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_ENV
              value: production
            - name: APP_BASE_URL
              value: https://lafryhi-ai-radar-1090908272413.us-central1.run.app
            - name: PERSISTENCE_ADAPTER
              value: firestore
            - name: AI_ADAPTER
              value: vertex
            - name: GOOGLE_CLOUD_PROJECT
              value: lafryhi-ai-radar-xprize
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: VERTEX_TIMEOUT_MS
              value: "60000"
            - name: GEMINI_MAX_OUTPUT_TOKENS
              value: "8192"
            - name: FIRESTORE_DATABASE_ID
              value: (default)
            - name: RSS_SCHEDULER_JOB_NAME
              value: lafryhi-ai-radar-rss-discovery
            - name: BILLING_ENABLED
              value: "false"
            - name: OPERATOR_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lafryhi-ai-radar-operator-token
                  key: "1"
            - name: RSS_SCHEDULER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lafryhi-ai-radar-scheduler-secret
                  key: "2"
  traffic:
    - latestRevision: true
      percent: 100
